name: Pages build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check search script syntax
        run: node --check assets/js/search.js
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Audit generated site security and privacy
        run: python3 scripts/audit_site.py _site
      - name: Audit CI dependency pinning
        run: python3 scripts/audit_ci.py
      - name: Check generated SEO metadata
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Head(HTMLParser):
              def __init__(self, html):
                  super().__init__()
                  self.meta = {}
                  self.links = []
                  self.language = None
                  self.feed(html)

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'html':
                      self.language = attrs.get('lang')
                  elif tag == 'meta':
                      self.meta[attrs.get('name', attrs.get('property'))] = attrs.get('content')
                  elif tag == 'link':
                      self.links.append(attrs)

          base = 'https://yodev21.github.io/yodev21'
          pages = [
              ('index.html', 'ja', '/', '/README.en.html'),
              ('README.en.html', 'en', '/README.en.html', '/'),
              ('TECHNOLOGIES.html', 'ja', '/TECHNOLOGIES.html', '/TECHNOLOGIES.en.html'),
              ('TECHNOLOGIES.en.html', 'en', '/TECHNOLOGIES.en.html', '/TECHNOLOGIES.html'),
              ('EXPERIENCE.html', 'ja', '/EXPERIENCE.html', '/EXPERIENCE.en.html'),
              ('EXPERIENCE.en.html', 'en', '/EXPERIENCE.en.html', '/EXPERIENCE.html'),
              ('PRIVACY.html', 'ja', '/PRIVACY.html', '/PRIVACY.en.html'),
              ('PRIVACY.en.html', 'en', '/PRIVACY.en.html', '/PRIVACY.html'),
          ]
          for filename, lang, path, alternate in pages:
              html = Path('_site', filename).read_text()
              head = Head(html)
              assert head.language == lang, filename
              assert head.meta.get('description'), filename
              assert head.meta.get('og:title') and head.meta.get('og:description'), filename
              assert head.meta.get('twitter:card') == 'summary', filename
              assert [x.get('href') for x in head.links if x.get('rel') == 'canonical'] == [base + path], filename
              assert any(x.get('rel') == 'alternate' and x.get('href') == base + alternate for x in head.links), filename
              assert '<title>' in html and '田中遥介' in html, filename
              assert 'noindex' not in html, filename
              assert 'https://static.cloudflareinsights.com/beacon.min.js' in html, filename
              assert 'data-cf-beacon' in html, filename
          assert Path('_site/sitemap.xml').exists()
          assert Path('_site/search.json').exists()
          assert Path('_site/assets/js/search.js').exists()
          for icon in ('github.svg', 'wantedly.svg', 'youtrust.svg', 'linkedin.ico', 'lapras.png', 'qiita.svg', 'x.svg'):
              assert Path('_site/assets/icons', icon).exists(), icon
          assert Path('_site/assets/icons/favicon.svg').exists()
          assert Path('_site/assets/images/projects/kikusyo-card.webp').exists()
          search_index = Path('_site/search.json').read_text()
          assert '田中遥介 — プロフィール' in search_index
          assert 'Technologies Used' in search_index
          assert 'Professional Experience' in search_index
          assert base + '/' in Path('_site/sitemap.xml').read_text()
          assert 'Sitemap: ' + base + '/sitemap.xml' in Path('_site/robots.txt').read_text()
          breadcrumb_pages = {
              'TECHNOLOGIES.html': 2,
              'TECHNOLOGIES.en.html': 2,
              'EXPERIENCE.html': 2,
              'EXPERIENCE.en.html': 2,
              'PRIVACY.html': 2,
              'PRIVACY.en.html': 2,
              'projects/personal/index.html': 2,
              'projects/personal/01_小説朗読投稿サービス.html': 3,
              'projects/personal/02_小説朗読投稿サービス_移行.html': 3,
          }
          for filename, count in breadcrumb_pages.items():
              rendered = Path('_site', filename).read_text()
              assert 'itemtype="https://schema.org/BreadcrumbList"' in rendered, filename
              assert rendered.count('itemtype="https://schema.org/ListItem"') == count, filename
              assert rendered.count('itemprop="position"') == count, filename
          home = Path('_site/index.html').read_text()
          home_en = Path('_site/README.en.html').read_text()
          assert 'class="breadcrumbs"' not in home
          assert 'class="breadcrumbs"' not in home_en
          assert 'class="hero"' in home
          assert 'id="hero-title"' in home
          assert 'assets/images/profile.jpg' in home
          hero = home.split('class="hero"', 1)[1].split('</section>', 1)[0]
          assert hero.count('class="hero-social"') == 1
          assert hero.count('<a ') == 4
          for profile in ('https://github.com/yodev21', 'https://youtrust.jp/users/yodev21', 'https://www.wantedly.com/users/62400896', 'https://www.linkedin.com/in/yodev21'):
              assert profile in hero
          assert '"@type": "ProfilePage"' in home
          assert '"@type": "Person"' in home
          assert '"sameAs"' in home
          assert 'property="og:image"' in home
          footer = home.split('class="site-footer"', 1)[1]
          assert 'class="site-footer__top"' in footer
          assert 'class="site-footer__bottom"' in footer
          for profile in ('https://github.com/yodev21', 'https://youtrust.jp/users/yodev21', 'https://www.wantedly.com/users/62400896', 'https://www.linkedin.com/in/yodev21'):
              assert profile in footer
          assert '/yodev21/projects/personal/' in footer
          assert 'data-search-dialog' in home
          assert 'data-search-index="/yodev21/search.json"' in home
          assert '<h2 id="リンク">' not in home
          assert 'class="site-footer__social"' in footer
          assert 'assets/icons/github.svg' in footer
          assert 'assets/icons/wantedly.svg' in footer
          for rendered_home in (home, home_en):
              assert rendered_home.count('id="contact"') == 1
              assert 'class="site-footer__contact"' in rendered_home
              assert 'mailto:yodev21.business@gmail.com' in rendered_home
          assert 'href="/yodev21/#contact"' in home
          assert 'href="/yodev21/README.en.html#contact"' in home_en
          assert '何かありましたら、以下の連絡先からお気軽にどうぞ。' in home
          assert 'メールは週に1回程度の確認になることがあります。' in home
          assert 'If you’d like to get in touch' in home_en
          assert 'I usually check email about once a week' in home_en
          assert 'class="article-grid"' in home
          assert home.count('class="article-card"') == 4
          assert home.count('class="article-card__media"') == 4
          for image in ('team-interview.svg', 'cloud-interview.svg', 'workplace-interview.svg', 'portfolio-interview.svg'):
              assert Path('_site/assets/images/articles', image).exists(), image
              assert 'assets/images/articles/' + image in home
          for rendered_home in (home, home_en):
              assert 'class="experience-details"' not in rendered_home
              current_cloud = rendered_home.split('<strong>Cloud Native</strong>', 1)[1].split('</tr>', 1)[0]
              assert 'Kubernetes' not in current_cloud
          assert '/yodev21/EXPERIENCE.html' in home
          assert '/yodev21/EXPERIENCE.en.html' in home_en
          for experience_page in ('EXPERIENCE.html', 'EXPERIENCE.en.html'):
              experience = Path('_site', experience_page).read_text()
              assert '<table>' in experience
              assert experience.count('<tr>') == 10
          assert 'class="capability-grid"' in home
          assert 'id="selected-work"' in home
          assert 'class="selected-work-list"' in home
          personal = Path('_site/projects/personal/index.html').read_text()
          assert 'class="stack-summary"' in personal
          assert 'class="product-card"' in personal
          assert 'https://kikusyo.com/' in personal
          assert '運営中' in personal
          assert '<dt>クラウド</dt>' in personal
          assert '<h1' in Path('_site/projects/personal/01_小説朗読投稿サービス.html').read_text()
          assert '<h1' in Path('_site/projects/personal/02_小説朗読投稿サービス_移行.html').read_text()
          architecture = Path('_site/projects/personal/02_小説朗読投稿サービス_移行.html').read_text()
          assert architecture.count('class="architecture-diagram"') == 3
          assert 'language-mermaid' not in architecture
          for diagram in ('before.svg', 'runtime.svg', 'delivery.svg'):
              assert Path('_site/assets/images/architecture', diagram).exists(), diagram
              assert 'assets/images/architecture/' + diagram in architecture
          css = Path('_site/assets/css/style.css').read_text()
          assert '--accent:' in css
          assert '.hero-social' in css
          assert '.site-footer__contact' in css
          assert 'overflow-wrap:anywhere' in css.replace(' ', '')
          assert '@media (max-width: 520px)' in css
          assert 'prefers-reduced-motion' in css
          print('SEO, navigation, portfolio structure and responsive styles OK')
          PY
